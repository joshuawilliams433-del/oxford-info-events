name: Update Oxford events and places

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    paths: ["curated.json", "sources.json", "fetch_events.py"]

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build events.json and places.json
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          SKIDDLE_API_KEY: ${{ secrets.SKIDDLE_API_KEY }}
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
        run: python fetch_events.py
      - name: Publish
        run: |
          cp docs/events.json /tmp/events.json
          cp docs/places.json /tmp/places.json 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/events.json docs/events.json
          cp /tmp/places.json docs/places.json 2>/dev/null || true
          git config user.name  "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add docs/events.json docs/places.json 2>/dev/null || git add docs/events.json
          git diff --cached --quiet || git commit -m "Update events and places $(date -u +%F)"
          git push
