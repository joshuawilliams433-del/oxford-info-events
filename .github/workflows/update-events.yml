name: Update Oxford events

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    paths: ["curated.json", "sources.json", "fetch_events.py"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build events.json
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          SKIDDLE_API_KEY: ${{ secrets.SKIDDLE_API_KEY }}
        run: python fetch_events.py
      - name: Publish
        run: |
          git config user.name  "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add docs/events.json
          git diff --cached --quiet || git commit -m "Update events $(date -u +%F)"
          git push
